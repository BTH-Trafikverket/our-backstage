openapi: 3.0.3
info:
  title: Gamification API
  version: 1.0.0
  description: OpenAPI contract for the internal Backstage gamification plugin.
servers:
  - url: /api/gamification
tags:
  - name: XP
  - name: Quests
  - name: Badges
paths:
  /badges:
    get:
      operationId: listBadges
      tags:
        - Badges
      summary: List all badges for admin management
      responses:
        '200':
          description: Badge list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Badge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createBadge
      tags:
        - Badges
      summary: Create a badge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBadgeRequest'
      responses:
        '201':
          description: Created badge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Badge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /badges/progress:
    get:
      operationId: getBadgeProgress
      tags:
        - Badges
      summary: Get badge progress for a subject or the authenticated user plus their teams
      parameters:
        - in: query
          name: subjectRef
          required: false
          schema:
            type: string
          description: Optional Backstage subject ref. If omitted for user credentials, badge progress is resolved across the authenticated user and all teams in ownershipEntityRefs. Service credentials must provide subjectRef.
      responses:
        '200':
          description: Badge progress for the subject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeProgressResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /badges/{id}:
    get:
      operationId: getBadge
      tags:
        - Badges
      summary: Get a badge
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Badge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Badge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateBadge
      tags:
        - Badges
      summary: Update a badge
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBadgeRequest'
      responses:
        '200':
          description: Updated badge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Badge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: archiveBadge
      tags:
        - Badges
      summary: Archive a badge
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Badge archived
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /xp:
    get:
      operationId: getXpStatus
      tags:
        - XP
      summary: Get XP status for a subject
      parameters:
        - in: query
          name: subjectRef
          required: false
          schema:
            type: string
          description: Optional Backstage subject ref. If omitted, the authenticated user is used. Service credentials must provide subjectRef.
      responses:
        '200':
          description: XP status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XpStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /quests:
    get:
      operationId: listQuests
      tags:
        - Quests
      summary: List quests
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Quest list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Quest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createQuest
      tags:
        - Quests
      summary: Create a quest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestRequest'
      responses:
        '201':
          description: Created quest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /quests/me:
    get:
      operationId: listMyQuests
      tags:
        - Quests
      summary: List quests with the current user's progress
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Quest list including progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuestWithProgress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /quests/{id}:
    patch:
      operationId: updateQuest
      tags:
        - Quests
      summary: Update a quest
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestRequest'
      responses:
        '200':
          description: Updated quest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteQuest
      tags:
        - Quests
      summary: Delete a quest
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Quest deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /quests/events:
    post:
      operationId: handleQuestEvent
      tags:
        - Quests
      summary: Trigger quest progress from an external event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestEventRequest'
      responses:
        '200':
          description: Event handled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestEventResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    BadRequest:
      description: Invalid request
    Forbidden:
      description: Authenticated but not allowed to access this resource
    Unauthorized:
      description: Missing or invalid credentials
    NotFound:
      description: Resource not found
  schemas:
    BadgeCriteria:
      type: object
      required:
        - quest_id
        - target_count
      additionalProperties: false
      properties:
        quest_id:
          type: string
          minLength: 1
        target_count:
          type: integer
          minimum: 1
    Badge:
      type: object
      required:
        - id
        - title
        - description
        - xp_reward
        - subject_type
        - criterias
        - created_at
        - updated_at
        - archived_at
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        xp_reward:
          type: integer
          minimum: 0
        subject_type:
          $ref: '#/components/schemas/QuestSubjectType'
        criterias:
          type: array
          items:
            $ref: '#/components/schemas/BadgeCriteria'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        archived_at:
          $ref: '#/components/schemas/NullableTimestamp'
    BadgeProgress:
      allOf:
        - $ref: '#/components/schemas/Badge'
        - type: object
          required:
            - isEarned
            - earnedAt
          properties:
            isEarned:
              type: boolean
            earnedAt:
              $ref: '#/components/schemas/NullableTimestamp'
    BadgeProgressResponse:
      type: object
      required:
        - subjectRefs
        - badges
      properties:
        subjectRefs:
          type: array
          items:
            type: string
        badges:
          type: array
          items:
            $ref: '#/components/schemas/BadgeProgress'
    CompletionPolicy:
      type: string
      enum:
        - ONE_TIME
        - REPEATABLE
    CreateBadgeRequest:
      type: object
      required:
        - title
        - description
        - xp_reward
        - subject_type
        - criterias
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        xp_reward:
          type: integer
          minimum: 0
        subject_type:
          $ref: '#/components/schemas/QuestSubjectType'
        criterias:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BadgeCriteria'
    UpdateBadgeRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        xp_reward:
          type: integer
          minimum: 0
        subject_type:
          $ref: '#/components/schemas/QuestSubjectType'
        criterias:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BadgeCriteria'
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type: string
      format: date-time
      nullable: true
    Quest:
      type: object
      required:
        - id
        - title
        - description
        - interval
        - xp_reward
        - subject_type
        - completion_policy
        - cooldown_days
        - created_at
        - updated_at
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        interval:
          type: integer
        xp_reward:
          type: integer
        subject_type:
          $ref: '#/components/schemas/QuestSubjectType'
        completion_policy:
          $ref: '#/components/schemas/CompletionPolicy'
        cooldown_days:
          type: integer
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    QuestWithProgress:
      allOf:
        - $ref: '#/components/schemas/Quest'
        - type: object
          required:
            - subject_ref
            - completion_count
            - progress_in_interval
            - next_milestone
          properties:
            subject_ref:
              type: string
              nullable: true
            completion_count:
              type: integer
            progress_in_interval:
              type: integer
            next_milestone:
              type: integer
    CreateQuestRequest:
      type: object
      required:
        - title
        - description
        - interval
        - xp_reward
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        interval:
          type: integer
          minimum: 1
        xp_reward:
          type: integer
          minimum: 1
        subject_type:
          $ref: '#/components/schemas/QuestSubjectType'
        entityRef:
          type: string
        completion_policy:
          $ref: '#/components/schemas/CompletionPolicy'
        cooldown_days:
          type: integer
          minimum: 1
          nullable: true
    UpdateQuestRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        interval:
          type: integer
          minimum: 1
        xp_reward:
          type: integer
          minimum: 0
        subject_type:
          $ref: '#/components/schemas/QuestSubjectType'
        completion_policy:
          $ref: '#/components/schemas/CompletionPolicy'
        cooldown_days:
          type: integer
          minimum: 1
          nullable: true
    QuestSubjectType:
      type: string
      enum:
        - user
        - team
    QuestEventActor:
      type: object
      additionalProperties: false
      properties:
        entityRef:
          type: string
          minLength: 1
        provider:
          type: string
          minLength: 1
        id:
          type: string
          minLength: 1
        login:
          type: string
          minLength: 1
        email:
          type: string
          format: email
      anyOf:
        - required:
            - entityRef
        - required:
            - provider
            - id
        - required:
            - provider
            - login
        - required:
            - provider
            - email
    QuestEventRequest:
      type: object
      required:
        - questId
      additionalProperties: false
      properties:
        questId:
          type: string
          format: uuid
        subjectRef:
          type: string
          minLength: 1
        actor:
          $ref: '#/components/schemas/QuestEventActor'
      anyOf:
        - required:
            - subjectRef
        - required:
            - actor
    QuestEventResult:
      type: object
      required:
        - duplicate
        - subjectRef
        - questId
      properties:
        duplicate:
          type: boolean
        subjectRef:
          type: string
        questId:
          type: string
        completionCount:
          type: integer
    XpStatus:
      type: object
      required:
        - subjectRef
        - totalXp
        - level
        - currentLevelXp
        - nextLevelXp
        - xpIntoLevel
        - xpToNextLevel
        - progress
      properties:
        subjectRef:
          type: string
        totalXp:
          type: integer
        level:
          type: integer
        currentLevelXp:
          type: integer
        nextLevelXp:
          type: integer
        xpIntoLevel:
          type: integer
        xpToNextLevel:
          type: integer
        progress:
          type: number
          minimum: 0
          maximum: 1
