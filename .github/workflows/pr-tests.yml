name: Gamification PR Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  gamification:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            .cache
            .yarn/install-state.gz
            node_modules
            packages/*/node_modules
            plugins/*/node_modules
          key: ${{ runner.os }}-node-24-yarn-4-node-modules-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Build cached E2E runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.e2e
          tags: backstage-e2e-runner:latest
          load: true
          cache-from: type=gha,scope=backstage-e2e-runner
          cache-to: type=gha,mode=max,scope=backstage-e2e-runner

      - name: Verify gamification plugin and Docker E2E
        env:
          E2E_USE_HOST_NODE_MODULES: "true"
        run: yarn verify:ci
