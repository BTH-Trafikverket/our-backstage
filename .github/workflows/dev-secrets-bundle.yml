name: Dev secrets bundle

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    name: Create dev env bundle
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Build bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle

          cat > bundle/.env.local <<EOF
          APP_BASE_URL=${{ secrets.APP_BASE_URL }}
          BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}
          BACKEND_PORT=${{ secrets.BACKEND_PORT }}
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}

          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}

          OAUTH_CLIENT_SECRET=${{ secrets.OAUTH_CLIENT_SECRET }}

          APP_CLIENT_ID=${{ secrets.APP_CLIENT_ID }}
          APP_CLIENT_SECRET=${{ secrets.APP_CLIENT_SECRET }}

          APP_PRIVATE_KEY_FILE=.secrets/app.pem
          EOF

          # --- Decode & validate PEM ---
          if [[ -z "${{ secrets.APP_PRIVATE_KEY_PEM_B64 }}" ]]; then
            echo "ERROR: APP_PRIVATE_KEY_PEM_B64 is empty or not available to this job."
            exit 1
          fi
 
          echo "${{ secrets.APP_PRIVATE_KEY_PEM_B64 }}" | tr -d '\n\r ' | base64 -d > bundle/app.pem

          # Ensure non-empty
          if [[ ! -s bundle/app.pem ]]; then
            echo "ERROR: Decoded PEM is empty."
            exit 1
          fi

          # Ensure it looks like a PEM
          head -n 1 bundle/app.pem | grep -E '^-----BEGIN (RSA )?PRIVATE KEY-----$' >/dev/null || {
            echo "ERROR: Decoded file does not look like a PEM private key. First line:"
            head -n 1 bundle/app.pem
            exit 1
          }

          chmod 600 bundle/app.pem

          echo "=== bundle contents ==="
          ls -la bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-secrets-bundle
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            bundle/.env.local
            bundle/app.pem
