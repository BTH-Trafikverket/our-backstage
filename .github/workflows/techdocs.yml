name: Publish TechDocs

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.TECHDOCS_S3_REGION }}

      - name: Install techdocs-cli
        run: npm install -g @techdocs/cli

      - name: Generate docs
        run: techdocs-cli generate --source-dir . --output-dir site

      - name: Publish to S3
        run: |
          techdocs-cli publish \
            --publisher-type awsS3 \
            --storage-name "${{ secrets.TECHDOCS_S3_BUCKET_NAME }}" \
            --directory site \
            --entity default/component/${{ github.event.repository.name }}name: Publish TechDocs

