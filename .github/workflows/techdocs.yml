name: Publish TechDocs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "catalog-info.yaml"
      - ".github/workflows/techdocs.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: techdocs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm (for npx downloads)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-techdocs-${{ hashFiles('**/yarn.lock', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-techdocs-

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.TECHDOCS_S3_REGION }}

      - name: Generate docs (uses Docker by default)
        run: npx @techdocs/cli generate --source-dir . --output-dir site

      - name: Publish to S3
        run: |
          npx @techdocs/cli publish \
            --publisher-type awsS3 \
            --storage-name "${{ secrets.TECHDOCS_S3_BUCKET_NAME }}" \
            --directory site \
            --entity default/component/${{ github.event.repository.name }}
