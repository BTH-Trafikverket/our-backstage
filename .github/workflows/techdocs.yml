name: Publish TechDocs

on:
  push:
    branches: [main]
    # Only run when docs-related files change (saves Actions minutes)
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "catalog-info.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Use Node (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        timeout-minutes: 1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.TECHDOCS_S3_REGION }}

      - name: Cache techdocs-cli
        id: cache-techdocs
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-techdocs-cli-${{ hashFiles('**/package-lock.json') }}

      - name: Install techdocs-cli
        run: npm install -g @techdocs/cli

      - name: Generate docs (no Docker)
        run: techdocs-cli generate --source-dir . --output-dir site --no-docker

      - name: Publish to S3
        run: |
          techdocs-cli publish \
            --publisher-type awsS3 \
            --storage-name "${{ secrets.TECHDOCS_S3_BUCKET_NAME }}" \
            --directory site \
            --entity default/component/${{ github.event.repository.name }}
