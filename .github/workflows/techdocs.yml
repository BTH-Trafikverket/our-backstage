name: Publish TechDocs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "catalog-info.yaml"
      - ".github/workflows/techdocs.yml"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python (cache pip)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install MkDocs TechDocs runtime (provides mkdocs)
        run: pip install "mkdocs-techdocs-core==1.*"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.TECHDOCS_S3_REGION }}

      - name: Generate docs (no Docker)
        run: npx @techdocs/cli@1.10.2 generate --source-dir . --output-dir site --no-docker

      - name: Publish to S3
        run: |
          npx @techdocs/cli@1.10.2 publish \
            --publisher-type awsS3 \
            --storage-name "${{ secrets.TECHDOCS_S3_BUCKET_NAME }}" \
            --directory site \
            --entity default/component/${{ github.event.repository.name }}
