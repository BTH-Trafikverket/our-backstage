# Generated from plugins/gamification-backend/src/schema/openapi.yaml by yarn gamification:openapi:sync.
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: gamification-api
  description: OpenAPI definition for the internal gamification backend plugin.
spec:
  type: openapi
  lifecycle: experimental
  owner: user:default/LinusAndersson02
  definition: |
    openapi: 3.0.3
    info:
      title: Gamification API
      version: 1.0.0
      description: OpenAPI contract for the internal Backstage gamification plugin.
    servers:
      - url: /api/gamification
    tags:
      - name: Leaderboard
      - name: XP
      - name: Quests
      - name: Badges
      - name: Reminders
      - name: Webhooks
    paths:
      /leaderboard:
        get:
          operationId: getLeaderboard
          tags:
            - Leaderboard
          summary: Get a paginated leaderboard ranked by total XP
          parameters:
            - in: query
              name: subjectType
              required: false
              schema:
                $ref: '#/components/schemas/LeaderboardSubjectType'
              description: Ranking scope. Use group to return Backstage teams. Defaults to user.
            - in: query
              name: timeRange
              required: false
              schema:
                $ref: '#/components/schemas/LeaderboardTimeRange'
              description: Time range filter. monthly means the current UTC calendar month, weekly means the current UTC week, and alltime disables date filtering.
            - in: query
              name: page
              required: false
              schema:
                type: integer
                minimum: 1
              description: Page number. Defaults to 1.
            - in: query
              name: limit
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 100
              description: Page size. Defaults to 25.
          responses:
            '200':
              description: Paginated XP leaderboard
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PaginatedLeaderboardResponse'
            '400':
              $ref: '#/components/responses/BadRequest'
            '401':
              $ref: '#/components/responses/Unauthorized'
      /xp:
        get:
          operationId: getXpStatus
          tags:
            - XP
          summary: Get XP status for a subject
          parameters:
            - in: query
              name: subjectRef
              required: false
              schema:
                type: string
              description: Optional Backstage subject ref. If omitted, the authenticated user is used. User credentials may only request the authenticated user or one of their ownership groups. Service credentials must provide subjectRef.
          responses:
            '200':
              description: XP status
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/XpStatus'
            '400':
              $ref: '#/components/responses/BadRequest'
            '401':
              $ref: '#/components/responses/Unauthorized'
      /quests/admin-status:
        get:
          operationId: getQuestAdminStatus
          tags:
            - Quests
          summary: Check whether the authenticated user has quest admin access
          responses:
            '200':
              description: Admin access state
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/AdminStatusResponse'
            '401':
              $ref: '#/components/responses/Unauthorized'
      /quests:
        get:
          operationId: listQuests
          tags:
            - Quests
          summary: List quests for admin management
          parameters:
            - in: query
              name: search
              required: false
              schema:
                type: string
            - in: query
              name: audience
              required: false
              schema:
                type: string
                enum:
                  - all
                  - individual
                  - team
            - in: query
              name: sortBy
              required: false
              schema:
                type: string
                enum:
                  - created_at
                  - title
                  - xp_reward
            - in: query
              name: order
              required: false
              schema:
                type: string
                enum:
                  - asc
                  - desc
            - in: query
              name: page
              required: false
              schema:
                type: integer
                minimum: 1
            - in: query
              name: limit
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 100
          responses:
            '200':
              description: Paginated quest list, including archived quests
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PaginatedQuestList'
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
        post:
          operationId: createQuest
          tags:
            - Quests
          summary: Create a quest
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CreateQuestRequest'
          responses:
            '201':
              description: Created quest
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Quest'
            '400':
              $ref: '#/components/responses/BadRequest'
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
      /quests/me:
        get:
          operationId: listMyQuests
          tags:
            - Quests
          summary: List quests with the current user's progress
          parameters:
            - in: query
              name: search
              required: false
              schema:
                type: string
            - in: query
              name: audience
              required: false
              schema:
                type: string
                enum:
                  - all
                  - individual
                  - team
            - in: query
              name: status
              required: false
              schema:
                type: string
                enum:
                  - active
                  - completed
                  - all
            - in: query
              name: team
              required: false
              schema:
                type: string
              description: Optional team entity ref used when audience is team or all.
            - in: query
              name: sortBy
              required: false
              schema:
                type: string
                enum:
                  - created_at
                  - title
                  - xp_reward
            - in: query
              name: order
              required: false
              schema:
                type: string
                enum:
                  - asc
                  - desc
            - in: query
              name: page
              required: false
              schema:
                type: integer
                minimum: 1
            - in: query
              name: limit
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 100
          responses:
            '200':
              description: Paginated quest list including progress
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PaginatedQuestProgressList'
            '401':
              $ref: '#/components/responses/Unauthorized'
      /quests/{id}:
        patch:
          operationId: updateQuest
          tags:
            - Quests
          summary: Update a quest
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
                format: uuid
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UpdateQuestRequest'
          responses:
            '200':
              description: Updated quest
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Quest'
            '400':
              $ref: '#/components/responses/BadRequest'
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
            '404':
              $ref: '#/components/responses/NotFound'
        delete:
          operationId: archiveQuest
          tags:
            - Quests
          summary: Archive a quest
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
                format: uuid
          responses:
            '204':
              description: Quest archived
            '400':
              $ref: '#/components/responses/BadRequest'
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
            '409':
              $ref: '#/components/responses/Conflict'
            '404':
              $ref: '#/components/responses/NotFound'
      /quests/events:
        post:
          operationId: handleQuestEvent
          tags:
            - Quests
          summary: Trigger quest progress from an external event
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/QuestEventRequest'
          responses:
            '200':
              description: Event handled
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/QuestEventResult'
            '400':
              $ref: '#/components/responses/BadRequest'
            '401':
              $ref: '#/components/responses/Unauthorized'
            '404':
              $ref: '#/components/responses/NotFound'
      /quests/catalog/run:
        post:
          operationId: runCatalogLinkedQuests
          tags:
            - Quests
          summary: Run catalog-linked quests for a team subject
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CatalogRunnerRequest'
          responses:
            '200':
              description: Catalog runner result
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/CatalogRunnerResult'
            '400':
              $ref: '#/components/responses/BadRequest'
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
            '404':
              $ref: '#/components/responses/NotFound'
      /badges:
        get:
          operationId: listBadges
          tags:
            - Badges
          summary: List badges for admin management
          parameters:
            - in: query
              name: search
              required: false
              schema:
                type: string
            - in: query
              name: page
              required: false
              schema:
                type: integer
                minimum: 1
            - in: query
              name: limit
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 100
          responses:
            '200':
              description: Paginated badge list, including archived badges
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PaginatedBadgeList'
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
        post:
          operationId: createBadge
          tags:
            - Badges
          summary: Create a badge
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CreateBadgeRequest'
          responses:
            '201':
              description: Created badge
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Badge'
            '400':
              $ref: '#/components/responses/BadRequest'
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
      /badges/progress:
        get:
          operationId: getBadgeProgress
          tags:
            - Badges
          summary: Get badge progress for a subject or the authenticated user plus their teams
          parameters:
            - in: query
              name: subjectRef
              required: false
              schema:
                type: string
              description: Optional Backstage subject ref. If omitted for user credentials, badge progress is resolved across the authenticated user and all owned teams. Service credentials must provide subjectRef.
            - in: query
              name: search
              required: false
              schema:
                type: string
              description: Optional title search applied to visible badges.
            - in: query
              name: audience
              required: false
              schema:
                type: string
                enum:
                  - all
                  - individual
                  - team
              description: Only used for user credentials when subjectRef is omitted.
            - in: query
              name: team
              required: false
              schema:
                type: string
              description: Optional team entity ref used to narrow team progress when subjectRef is omitted.
            - in: query
              name: sortBy
              required: false
              schema:
                type: string
                enum:
                  - earned_at
                  - created_at
                  - title
                  - xp_reward
            - in: query
              name: order
              required: false
              schema:
                type: string
                enum:
                  - asc
                  - desc
            - in: query
              name: page
              required: false
              schema:
                type: integer
                minimum: 1
            - in: query
              name: limit
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 100
          responses:
            '200':
              description: Paginated badge progress
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/BadgeProgressResponse'
            '400':
              $ref: '#/components/responses/BadRequest'
            '401':
              $ref: '#/components/responses/Unauthorized'
      /badges/{id}:
        get:
          operationId: getBadge
          tags:
            - Badges
          summary: Get a badge
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
                format: uuid
          responses:
            '200':
              description: Badge
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Badge'
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
            '404':
              $ref: '#/components/responses/NotFound'
        patch:
          operationId: updateBadge
          tags:
            - Badges
          summary: Update a badge
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
                format: uuid
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UpdateBadgeRequest'
          responses:
            '200':
              description: Updated badge
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Badge'
            '400':
              $ref: '#/components/responses/BadRequest'
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
            '404':
              $ref: '#/components/responses/NotFound'
        delete:
          operationId: archiveBadge
          tags:
            - Badges
          summary: Archive a badge
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
                format: uuid
          responses:
            '204':
              description: Badge archived
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
            '404':
              $ref: '#/components/responses/NotFound'
      /reminders:
        get:
          operationId: listMyReminders
          tags:
            - Reminders
          summary: List reminders for the authenticated user and their ownership groups
          responses:
            '200':
              description: Visible reminders
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ReminderListResponse'
            '401':
              $ref: '#/components/responses/Unauthorized'
      /reminders/{id}/dismiss:
        post:
          operationId: dismissReminder
          tags:
            - Reminders
          summary: Dismiss a reminder for the authenticated user
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
                format: uuid
          responses:
            '204':
              description: Reminder dismissed
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
            '404':
              $ref: '#/components/responses/NotFound'
      /reminders/{id}/disable:
        post:
          operationId: disableReminder
          tags:
            - Reminders
          summary: Disable a reminder for the authenticated user
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
                format: uuid
          responses:
            '204':
              description: Reminder disabled
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
            '404':
              $ref: '#/components/responses/NotFound'
      /webhooks:
        get:
          operationId: listWebhooks
          tags:
            - Webhooks
          summary: List webhooks for admin management
          parameters:
            - in: query
              name: page
              required: false
              schema:
                type: integer
                minimum: 1
            - in: query
              name: limit
              required: false
              schema:
                type: integer
                minimum: 1
                maximum: 100
          responses:
            '200':
              description: Paginated webhook list
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PaginatedWebhookList'
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
        post:
          operationId: createWebhook
          tags:
            - Webhooks
          summary: Create a webhook
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CreateWebhookRequest'
          responses:
            '201':
              description: Created webhook
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Webhook'
            '400':
              $ref: '#/components/responses/BadRequest'
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
      /webhooks/events/{event}/metadata:
        get:
          operationId: getWebhookEventMetadata
          tags:
            - Webhooks
          summary: Get metadata for a webhook trigger event
          parameters:
            - in: path
              name: event
              required: true
              schema:
                $ref: '#/components/schemas/WebhookEventName'
          responses:
            '200':
              description: Webhook event metadata
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/WebhookEventMetadata'
      /webhooks/{id}:
        patch:
          operationId: updateWebhook
          tags:
            - Webhooks
          summary: Update a webhook
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
                format: uuid
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UpdateWebhookRequest'
          responses:
            '200':
              description: Updated webhook
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Webhook'
            '400':
              $ref: '#/components/responses/BadRequest'
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
            '404':
              $ref: '#/components/responses/NotFound'
        delete:
          operationId: deleteWebhook
          tags:
            - Webhooks
          summary: Delete a webhook
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
                format: uuid
          responses:
            '204':
              description: Webhook deleted
            '401':
              $ref: '#/components/responses/Unauthorized'
            '403':
              $ref: '#/components/responses/Forbidden'
            '404':
              $ref: '#/components/responses/NotFound'
    components:
      responses:
        BadRequest:
          description: Invalid request
        Forbidden:
          description: Authenticated but not allowed to access this resource
        Unauthorized:
          description: Missing or invalid credentials
        NotFound:
          description: Resource not found
        Conflict:
          description: Request conflicts with the current resource state
      schemas:
        AdminStatusResponse:
          type: object
          required:
            - isAdmin
          additionalProperties: false
          properties:
            isAdmin:
              type: boolean
        Timestamp:
          type: string
          format: date-time
        NullableTimestamp:
          type: string
          format: date-time
          nullable: true
        Pagination:
          type: object
          required:
            - page
            - limit
            - total
            - totalPages
          additionalProperties: false
          properties:
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
            total:
              type: integer
              minimum: 0
            totalPages:
              type: integer
              minimum: 0
        LeaderboardSubjectType:
          type: string
          enum:
            - user
            - group
        LeaderboardTimeRange:
          type: string
          enum:
            - weekly
            - monthly
            - alltime
        LeaderboardEntry:
          type: object
          required:
            - rank
            - subjectRef
            - subjectType
            - totalXp
          additionalProperties: false
          properties:
            rank:
              type: integer
              minimum: 1
            subjectRef:
              type: string
            subjectType:
              $ref: '#/components/schemas/LeaderboardSubjectType'
            totalXp:
              type: integer
              minimum: 0
        PaginatedLeaderboardResponse:
          type: object
          required:
            - subjectType
            - timeRange
            - data
            - pagination
          additionalProperties: false
          properties:
            subjectType:
              $ref: '#/components/schemas/LeaderboardSubjectType'
            timeRange:
              $ref: '#/components/schemas/LeaderboardTimeRange'
            data:
              type: array
              items:
                $ref: '#/components/schemas/LeaderboardEntry'
            pagination:
              $ref: '#/components/schemas/Pagination'
        CompletionPolicy:
          type: string
          enum:
            - ONE_TIME
            - REPEATABLE
        QuestSubjectType:
          type: string
          enum:
            - user
            - team
        QuestMode:
          type: string
          enum:
            - event_driven
            - catalog
        CatalogCondition:
          type: string
          enum:
            - missing_techdocs
            - missing_owner
            - missing_description
            - missing_tags
        CatalogRuleVersion:
          type: string
          enum:
            - v1
        CatalogRuleCheckType:
          type: string
          enum:
            - missing_techdocs
            - missing_owner
            - missing_description
            - missing_tags
            - missing_lifecycle
            - required_annotation
            - missing_relation
            - missing_dependency_metadata
        CatalogRule:
          type: object
          required:
            - version
            - check
          additionalProperties: false
          properties:
            version:
              $ref: '#/components/schemas/CatalogRuleVersion'
            check:
              oneOf:
                - type: object
                  required:
                    - type
                  additionalProperties: false
                  properties:
                    type:
                      type: string
                      enum:
                        - missing_techdocs
                        - missing_owner
                        - missing_description
                        - missing_tags
                        - missing_lifecycle
                - type: object
                  required:
                    - type
                    - annotation
                  additionalProperties: false
                  properties:
                    type:
                      type: string
                      enum:
                        - required_annotation
                    annotation:
                      type: string
                      minLength: 1
                - type: object
                  required:
                    - type
                    - relationType
                  additionalProperties: false
                  properties:
                    type:
                      type: string
                      enum:
                        - missing_relation
                    relationType:
                      type: string
                      minLength: 1
                - type: object
                  required:
                    - type
                    - field
                  additionalProperties: false
                  properties:
                    type:
                      type: string
                      enum:
                        - missing_dependency_metadata
                    field:
                      type: string
                      minLength: 1
        QuestReminderConfig:
          type: object
          required:
            - description
            - day
          additionalProperties: false
          properties:
            description:
              type: string
              minLength: 1
            day:
              type: integer
              minimum: 1
        LinkedQuestConfig:
          type: object
          additionalProperties: false
          properties:
            catalog_condition:
              $ref: '#/components/schemas/CatalogCondition'
            catalog_rule:
              $ref: '#/components/schemas/CatalogRule'
            reminder:
              $ref: '#/components/schemas/QuestReminderConfig'
        Quest:
          type: object
          required:
            - id
            - title
            - description
            - target_count
            - xp_reward
            - subject_type
            - quest_mode
            - linked_config
            - completion_policy
            - cooldown_days
            - created_at
            - updated_at
            - archived_at
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
            description:
              type: string
            target_count:
              type: integer
              minimum: 1
            xp_reward:
              type: integer
              minimum: 0
            subject_type:
              $ref: '#/components/schemas/QuestSubjectType'
            quest_mode:
              $ref: '#/components/schemas/QuestMode'
            linked_config:
              $ref: '#/components/schemas/LinkedQuestConfig'
            completion_policy:
              $ref: '#/components/schemas/CompletionPolicy'
            cooldown_days:
              type: integer
              minimum: 1
              nullable: true
            created_at:
              $ref: '#/components/schemas/Timestamp'
            updated_at:
              $ref: '#/components/schemas/Timestamp'
            archived_at:
              $ref: '#/components/schemas/NullableTimestamp'
        QuestWithProgress:
          allOf:
            - $ref: '#/components/schemas/Quest'
            - type: object
              required:
                - subject_ref
                - completion_count
                - progress_toward_target
                - next_milestone
              additionalProperties: false
              properties:
                subject_ref:
                  type: string
                completion_count:
                  type: integer
                  minimum: 0
                progress_toward_target:
                  type: integer
                  minimum: 0
                next_milestone:
                  type: integer
                  minimum: 0
        PaginatedQuestList:
