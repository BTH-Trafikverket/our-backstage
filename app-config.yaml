app:
  title: BTH-Trafikverket
  baseUrl: ${APP_BASE_URL}

organization:
  name: Bth-Trafikverket

backend:
  baseUrl: ${BACKEND_BASE_URL}
  listen:
    port: ${BACKEND_PORT}
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: ${CORS_ORIGIN}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  # You overwrote the default sqlite dev DB with Postgres
  database:
    client: pg
    connection:
      host: ${DB_HOST}
      port: ${DB_PORT}
      user: ${DB_USER}
      password: ${DB_PASSWORD}
      database: ${DB_NAME}

integrations:
  github:
    - host: github.com
      apps:
        - appId: 2836065
          clientId: ${APP_CLIENT_ID}
          clientSecret: ${APP_CLIENT_SECRET}
          privateKey:
            $file: ${APP_PRIVATE_KEY_FILE}
          allowedInstallationOwners:
            - BTH-Trafikverket

auth:
  environment: development
  keyStore:
    provider: database
  providers:
    github:
      development:
        clientId: Ov23li5CR4Yy5AGOz4i3
        clientSecret: ${OAUTH_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

# Keeping the rest from your original app-config.yaml
proxy:
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

techdocs:
  builder: 'local'
  generator:
    runIn: 'docker'
  publisher:
    type: 'local'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location]

  # Your overwrite: githubOrg provider
  providers:
    githubOrg:
      id: production
      githubUrl: https://github.com
      orgs: ['BTH-Trafikverket']
      schedule:
        initialDelay: { seconds: 30 }
        frequency: { seconds: 30 }
        timeout: { minutes: 50 }

  # Keeping your existing example locations (safe to keep even if you also use githubOrg)
  locations:
    - type: file
      target: ../../examples/entities.yaml

    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

permission:
  enabled: true  
