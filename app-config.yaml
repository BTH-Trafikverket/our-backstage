app:
  title: BTH-Trafikverket
  baseUrl: ${APP_BASE_URL}

organization:
  name: Bth-Trafikverket

backend:
  baseUrl: ${BACKEND_BASE_URL}
  listen:
    port: ${BACKEND_PORT}
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: ${CORS_ORIGIN}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  # You overwrote the default sqlite dev DB with Postgres
  database:
    client: pg
    connection:
      host: ${DB_HOST}
      port: ${DB_PORT}
      user: ${DB_USER}
      password: ${DB_PASSWORD}
      database: ${DB_NAME}

integrations:
  github:
    - host: github.com
      apps:
        - appId: 2836065
          clientId: ${APP_CLIENT_ID}
          clientSecret: ${APP_CLIENT_SECRET}
          privateKey:
            $file: ${APP_PRIVATE_KEY_FILE}
          allowedInstallationOwners:
            - BTH-Trafikverket

auth:
  environment: development
  keyStore:
    provider: database
  providers:
    github:
      development:
        clientId: Ov23li5CR4Yy5AGOz4i3
        clientSecret: ${OAUTH_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

# Keeping the rest from your original app-config.yaml
proxy:
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

techdocs:
  builder: external
  publisher:
    type: awsS3
    awsS3:
      bucketName: ${TECHDOCS_S3_BUCKET_NAME}
      region: ${TECHDOCS_S3_REGION}
      # optional, but helps when running locally:
      s3ForcePathStyle: false

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration

  rules:
    - allow: [Component, System, API, Resource, Location]

  providers:
    # Keeps syncing users/groups from the org
    githubOrg:
      id: production
      githubUrl: https://github.com
      orgs: ['BTH-Trafikverket']
      schedule:
        initialDelay: { seconds: 10 }
        frequency: { minutes: 30 }
        timeout: { minutes: 50 }

    # Scans repos in the org for /catalog-info.yaml and ingests entities
    github:
      bth:
        organization: BTH-Trafikverket
        catalogPath: /catalog-info.yaml
        filters:
          branch: main
        schedule:
          initialDelay: { seconds: 20 }
          frequency: { minutes: 30 }
          timeout: { minutes: 10 }

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

permission:
  enabled: true  
